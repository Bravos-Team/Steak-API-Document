components:
  schemas:
    Error:
      description: Lỗi trả về
      type: object
      properties:
        message:
          type: string
          example: "Username or password is invalid"
        error:
          require: false
          type: object
          additionalProperties:
            type: string
          example:
            username: username cannot contains special characters
            password: password cannot be blank

    UsernameLoginRequest:
      description: Đăng nhập bằng username
      type: object
      properties:
        username:
          type: string
          minLength: 6
          maxLength: 32
          example: bravos123
        password:
          type: password
          example: PassW0rD@
        deviceId:
          type: string
          example: 1q2w3whj4j3nk
        deviceInfo:
          type: string
          example: ubuntu chrome browser
    EmailLoginRequest:
      description: Đăng nhập bằng email
      type: object
      properties:
        email:
          type: email
          minLength: 6
          maxLength: 32
          example: bravos123@baodepzai.com
        password:
          type: password
          example: PassW0rD@
        deviceId:
          type: string
          example: 1q2w3whj4j3nk
        deviceInfo:
          type: string
          example: ubuntu chrome browser
    UserLoginResponse:
      type: object
      properties:
        name:
          type: string
          example: QuocBaoDepTrai
        avatar:
          type: string
          example: https://ccdn.steak.io.vn
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 6
          maxLength: 32
          example: bravos123
        email:
          type: email
          example: bravos@steak.vn
        password:
          type: password
          example: PassworD2@
    RefreshRequest:
      type: object
      properties:
        deviceId:
          type: string
          example: 1q2w3whj4j3nk
    PublisherRegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Ubisuck
        businessEmail:
          type: string
          example: steak@bravos.io.vn
        phone:
          type: string
          example: sdt liên hệ nhà phát hành
        masterUsername:
          type: string
          example: ubisuckmaster
        masterEmail:
          type: string
          example: master@steak.io.vn
        masterPassword:
          type: string
          example: 1982912@kja@AA
    ImageUploadPresignRequest:
      type: object
      properties:
        fileName:
          type: string
          example: 1q2w3e4r5t6y7u8i9o0p.jpg
        fileSize:
          type: long
          example: 1024000

    ImageUploadPresignResponse:
      type: object
      properties:
        fileName:
          type: string
          example: 1q2w3e4r5t6y7u8i9o0p.jpg
        signedUrl:
          type: string
          example: https://steak.io.vn/upload/1q2w3e4r5t6y7u8i9o0p.jpg

    ImageDeleteRequest:
      type: object
      properties:
        url:
          type: string
          example: https://ccdn.steak.io.vn/1q2w3e4r5t6y7u8i9o0p.jpg

    GameUploadPresignedRequest:
      type: object
      properties:
        fileName:
          type: string
          example: game-part-1.bin
        fileSize:
          type: long
          example: 104857600
        partNumber:
          type: integer
          example: 1

    PresignedUrlResponse:
      type: object
      properties:
        fileName:
          type: string
          example: game-part-1.bin
        signedUrl:
          type: string
          example: https://steak.io.vn/upload/game-part-1.bin

    RecreatePresignedUrlRequest:
      type: object
      properties:
        fileName:
          type: string
          example: game-part-1.bin
        uploadId:
          type: string
          example: 1234567890abcdef

    CompleteMultipartRequest:
      type: object
      properties:
        fileName:
          type: string
          example: game-full.bin
        uploadId:
          type: string
          example: 1234567890abcdef
        parts:
          type: array
          items:
            type: object
            properties:
              partNumber:
                type: integer
                example: 1
              eTag:
                type: string
                example: "etag-part-1"

    SaveProjectRequest:
      type: object
      properties:
        id:
          type: integer
          example: 900000000000001
        name:
          type: string
          example: My Awesome Game
        price:
          type: number
          format: double
          example: 19.99
        developerTeam:
          type: array
          items:
            type: string
          example: [ "Alice", "Bob" ]
        region:
          type: string
          example: US
        thumbnail:
          type: string
          example: https://cdn.steak.io.vn/thumbnail.jpg
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        shortDescription:
          type: string
          example: Short game description
        longDescription:
          type: string
          example: Long game description
        platform:
          type: array
          items:
            type: string
          example: [ "Windows", "Mac" ]
        systemRequirements:
          $ref: '#/components/schemas/SystemRequirements'
        internetConnection:
          type: boolean
          example: true
        languageSupported:
          type: array
          items:
            type: string
          example: [ "en", "vi" ]
        estimatedReleaseDate:
          type: string
          format: date-time
          example: 2024-12-31T00:00:00Z
    Media:
      type: object
      properties:
        type:
          type: string
          example: image
        url:
          type: string
          example: https://cdn.steak.io.vn/media.jpg
    SystemRequirements:
      type: object
      properties:
        minimum:
          $ref: '#/components/schemas/Requirement'
        recommend:
          $ref: '#/components/schemas/Requirement'
    Requirement:
      type: object
      properties:
        # Define fields as needed, e.g.:
        cpu:
          type: string
          example: Intel i5
        ram:
          type: string
          example: 8GB
        gpu:
          type: string
          example: GTX 1060
        storage:
          type: string
          example: 50GB
    ReviewerReviewReplyRequest:
      type: object
      properties:
        submissionId:
          type: integer
          example: 123456789
        status:
          type: string
          enum: [ PENDING_REVIEW, ACCEPTED, REJECTED ]
          example: ACCEPTED
        content:
          type: string
          example: "Game meets all requirements."
        attachments:
          type: array
          items:
            type: string
          example: [ "https://cdn.steak.io.vn/review-attachment1.jpg" ]
    UpdatePreBuildRequest:
      type: object
      properties:
        projectId:
          type: integer
          example: 900000000000001
        versionName:
          type: string
          example: "v1.0.0"
        execPath:
          type: string
          example: "bin/steak.exe"
        downloadUrl:
          type: string
          format: uri
          example: "https://cdn.steak.io.vn/game/steak-v1.0.0.zip"
        checksum:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
    RefreshTokenRequest:
      type: object
      properties:
        deviceId:
          type: string
          example: "eyJhbGciOi"
        deviceInfo:
          type: string
          example: "ubuntu chrome browser"
    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: integer
                example: 900000000000001
              name:
                type: string
                example: "My Awesome Game"
              price:
                type: number
                format: double
                example: 19.99
              thumbnail:
                type: string
                example: "https://cdn.steak.io.vn/thumbnail.jpg"
        totalPrice:
          type: number
          format: double
          example: 19.99
    WishlistResponse:
      type: array
      items:
        type: object
        properties:
          gameId:
            type: integer
            example: 900000000000001
          name:
            type: string
            example: "My Awesome Game"
          price:
            type: number
            format: double
            example: 19.99
          thumbnail:
            type: string
            example: "https://cdn.steak.io.vn/thumbnail.jpg"
    CreateOrderRequest:
      type: object
      properties:
        gameIds:
          type: array
          items:
            type: integer
          example: [ 900000000000001, 900000000000002 ]
    CreateAccountRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 6
          maxLength: 32
          pattern: "^[a-zA-Z0-9]{6,32}$"
          example: bravos123
          description: Username cannot contain special characters and must be between 6 and 32 characters
        email:
          type: string
          format: email
          example: bravos@steak.vn
        password:
          type: string
          minLength: 1
          example: PassworD2@
          description: Password cannot be blank
        assignedRoles:
          type: array
          items:
            type: integer
            format: int64
          example: [ 1, 2, 3 ]
      required:
        - username
        - email
        - password
    CreateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: "admin"
          description: Role name cannot be blank
        description:
          type: string
          example: "Administrator role with full permissions"
        permissionIds:
          type: array
          items:
            type: integer
            format: int64
          example: [ 1, 2, 3 ]
      required:
        - name
    GameDownloadResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          example: https://cdn.steak.io.vn/game/steak-v1.0.0.tar.zst
        fileName:
          type: string
          example: steak-v1.0.0.tar.zst
        execPath:
          type: string
          example: bin/steak.exe
        checksum:
          type: string
          example: d41d8cd98f00b204e9800998ecf8427e
        fileSize:
          type: integer
          format: int64
          example: 104857600
    ResubmitProjectRequest:
      type: object
      properties:
        submissionId:
          type: integer
          format: int64
          example: 900000000000001
        content:
          type: string
          example: "Updated project content for resubmission"
        attachments:
          type: array
          items:
            type: string
          example: [ "https://cdn.steak.io.vn/attachment1.jpg" ]
      required:
        - submissionId
    UpdateGameDetailsRequest:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
          example: 900000000000001
        title:
          type: string
          example: "My Awesome Game"
        developerTeams:
          type: array
          items:
            type: string
          example: [ "Alice", "Bob" ]
        regions:
          type: array
          items:
            type: string
          example: [ "US", "EU" ]
        thumbnail:
          type: string
          example: https://cdn.steak.io.vn/thumbnail.jpg
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        shortDescription:
          type: string
          example: "Short game description"
        longDescription:
          type: string
          example: "Long game description"
        platforms:
          type: array
          items:
            type: string
          example: [ "Windows", "Mac" ]
        systemRequirements:
          $ref: '#/components/schemas/SystemRequirements'
        languageSupported:
          type: array
          items:
            type: string
          example: [ "en", "vi" ]
        genres:
          type: array
          items:
            type: integer
          example: [ 1, 2, 3 ]
        tags:
          type: array
          items:
            type: integer
          example: [ 10, 20 ]
      required:
        - gameId
    UpdateGameStatusRequest:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
          example: 900000000000001
        status:
          type: string
          enum: [ OPENING,CLOSED,RETIRED ]
          example: CLOSED
      required:
        - gameId
        - status
    UpdateGamePriceRequest:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
          example: 900000000000001
        price:
          type: number
          format: double
          example: 19.99
      required:
        - gameId
        - price
    CreateNewVersionRequest:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
          example: 900000000000001
        versionName:
          type: string
          example: "v1.0.0"
        isReady:
          type: boolean
          example: true
        releaseDate:
          type: integer
          format: int64
          example: 1719859200000
        changeLog:
          type: string
          example: "Bug fixes and performance improvements"
        execPath:
          type: string
          example: "bin/steak.exe"
        downloadUrl:
          type: string
          pattern: "^(https?|ftp)://[^\\s/$.?#].\\S*$"
          example: "https://cdn.steak.io.vn/game/steak-v1.0.0.zip"
        checksum:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
        fileSize:
          type: integer
          format: int64
          example: 104857600
        installSize:
          type: integer
          format: int64
          example: 209715200
      required:
        - gameId
        - versionName
        - execPath
        - downloadUrl
        - checksum
        - fileSize
        - installSize
    UpdateDraftVersionRequest:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
          example: 900000000000001
        versionId:
          type: integer
          format: int64
          example: 100000000000001
        versionName:
          type: string
          example: "v1.0.1-beta"
        changeLog:
          type: string
          example: "Added new features and fixed bugs"
        isReady:
          type: boolean
          example: false
        releaseDate:
          type: integer
          format: int64
          example: 1719859200000
        execPath:
          type: string
          example: "bin/steak.exe"
        downloadUrl:
          type: string
          pattern: "^(https?|ftp)://[^\\s/$.?#].\\S*$"
          example: "https://cdn.steak.io.vn/game/steak-v1.0.1-beta.zip"
        checksum:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
        fileSize:
          type: integer
          format: int64
          example: 104857600
        installSize:
          type: integer
          format: int64
          example: 209715200
      required:
        - gameId
        - versionId
        - versionName
        - execPath
        - downloadUrl
        - checksum
        - fileSize
        - installSize
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 900000000000001
        displayName:
          type: string
          example: "QuocBaoDepTrai"
        birthDate:
          type: string
          example: "1990-01-01"
        sex:
          type: boolean
          example: true
        avatarUrl:
          type: string
          example: "https://cdn.steak.io.vn/avatar.jpg"
        bio:
          type: string
          example: "Game developer and steak lover."
      required:
        - id

    PublisherProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 900000000000001
        name:
          type: string
          example: "Ubisuck"
        email:
          type: string
          example: "steak@bravos.io.vn"
        phone:
          type: string
          example: "0123456789"
        status:
          type: integer
          enum: [ 0, 1, 2 ]
          description: "0=UNVERIFIED, 1=VERIFIED, 2=SUSPENDED"
          example: 0
        logoUrl:
          type: string
          example: "https://cdn.steak.io.vn/logo.jpg"
        createdAt:
          type: integer
          format: int64
          example: 1719859200000
        updatedAt:
          type: integer
          format: int64
          example: 1719959200000
      required:
        - id
        - name
        - email
        - status
        - createdAt
        - updatedAt

    FilterQuery:
      type: object
      properties:
        keyword:
          type: string
          description: Từ khóa tìm kiếm
        genreIds:
          type: array
          items:
            type: integer
            format: int64
          description: Danh sách genreId
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          description: Danh sách tagId
        minPrice:
          type: number
          format: double
          description: Giá tối thiểu
        maxPrice:
          type: number
          format: double
          description: Giá tối đa
        sortBy:
          type: string
          description: Trường sắp xếp
        page:
          type: integer
          minimum: 1
          default: 1
          description: Trang, bắt đầu từ 1
        pageSize:
          type: integer
          minimum: 1
          default: 10
          description: Số lượng trên mỗi trang
      description: Tham số lọc và phân trang cho truy vấn danh sách
